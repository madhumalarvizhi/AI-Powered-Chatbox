<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AI Customer Support Chatbot</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f9; display: flex; justify-content: center; margin-top: 50px; }
        .chat-box { width: 400px; background: white; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); overflow: hidden; }
        .header { background: #007bff; color: white; padding: 15px; text-align: center; font-weight: bold; }
        .messages { height: 350px; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        .msg { padding: 10px; border-radius: 8px; max-width: 75%; }
        .user { background: #007bff; color: white; align-self: flex-end; }
        .bot { background: #e9ecef; color: black; align-self: flex-start; }
        .input-area { display: flex; border-top: 1px solid #ddd; }
        input { flex: 1; padding: 12px; border: none; outline: none; }
        button { padding: 12px 20px; background: #007bff; color: white; border: none; cursor: pointer; }
    </style>
</head>
<body>
    <div class="chat-box">
        <div class="header">AI Support Chatbot</div>
        <div class="messages" id="messages">
            <div class="msg bot">Hello! Ask me about our services, timings, or contact info.</div>
        </div>
        <div class="input-area">
            <input type="text" id="userInput" placeholder="Type a message..." onkeypress="if(event.key==='Enter') sendMessage()">
            <button onclick="sendMessage()">Send</button>
        </div>
    </div>

    <script>
        async function sendMessage() {
            let input = document.getElementById("userInput");
            let text = input.value.trim();
            if (!text) return;

            let msgBox = document.getElementById("messages");
            msgBox.innerHTML += `<div class="msg user">${text}</div>`;
            input.value = "";

            let response = await fetch("/chat", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ message: text })
            });
            let data = await response.json();
            msgBox.innerHTML += `<div class="msg bot">${data.reply}</div>`;
            msgBox.scrollTop = msgBox.scrollHeight;
        }
    </script>
</body>
</html>
